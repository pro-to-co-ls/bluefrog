name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  release:
    name: build & publish release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu

      # Activates once the `bluefrog` binary crate exists (milestone M-ops). Builds the release
      # binary, packages it, and attaches it (plus checksums) to the GitHub release for the tag.
      - name: Build & upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: bluefrog
          target: x86_64-unknown-linux-gnu
          token: ${{ secrets.GITHUB_TOKEN }}
